# Cargo.lock carries the version too, so a bump leaves it stale. `after`
# regenerates it and `stage` puts it on the Version PR commit.
prepare:
  after: [cargo, update, --workspace]
  stage: [Cargo.lock]

# publish = false in Cargo.toml: the release is a tag, a GitHub Release, and
# its tarballs, with no registry upload.
packages:
  - name: hakkiri
    path: Cargo.toml
    publisher: none

# The machine of an asset that verctl has no built-in record for. This
# repository is public, so GitHub's free arm64 Ubuntu runner builds
# linux-arm64.
runners:
  arm64:
    labels: [ubuntu-26.04-arm]

# One key per host binary, named for the job, the tarball and the platform.
# darwin-arm64 and linux-x64 are built-in records in verctl.
# Their runner labels (the free xcode-27 and ubuntu-26.04), os, arch and
# triple come from it. linux-arm64 has none, so it states all four.
#
# Each binary builds natively with the runner's own C compiler, since the
# tree-sitter grammars need one. Nothing is cross-compiled.
#
# The Linux binaries are static musl builds: a static binary starts on a
# machine with no glibc loader, such as NixOS without nix-ld. The musl C
# compiler is the zig that mise installs, and mise.toml passes it to cc-rs.
#
# A declared prepare replaces the one verctl ships, so the release:prepare
# task adds the Rust target.
assets:
  prepare: [mise, run, "release:prepare", "{triple}"]
  darwin-arm64: {}
  linux-x64:
    triple: x86_64-unknown-linux-musl
  linux-arm64:
    runner: arm64
    os: linux
    arch: arm64
    triple: aarch64-unknown-linux-musl

# Hand-written version spellings outside Cargo.toml. Each is named once and
# listed by the file that carries it; too few or too many stop the release.
patterns:
  install:
    match: "mise use github:victor-software-house/hakkiri@{version}"
    whole_line: true
    occurrences: once
  skill:
    match: "version: {version}"
    whole_line: true
    occurrences: once

pins:
  - file: README.md
    package: hakkiri
    patterns: [install]
  - file: skills/hakkiri/SKILL.md
    package: hakkiri
    patterns: [skill]

# Maintainers and Apps a changelog never credits.
changelog:
  internal_authors:
    - any-victor
    - "github-actions[bot]"
    - "vsh-changeset-version[bot]"
