# Spelling, checked by `mise run lint:typos`.
[files]
extend-exclude = [
  "*.lock",
  "tests/fixtures/readability/syllables.tsv",
  "data/dictionary/en_US-web.aff",
  "data/dictionary/en_US-web.dic",
  "tests/fixtures/dictionary/vale.tsv",
  "tests/fixtures/capitalization/vale.tsv",
  "tests/fixtures/spelling-parity",
  "tests/fixtures/vale-spelling",
  "tests/fixtures/vale-styles",
  "tests/fixtures/vocabularies",
  "tests/fixtures/vocabulary-rules",
  "tests/fixtures/yaml-vocabularies",
  "tests/fixtures/ignores",
  "tests/fixtures/comment-controls",
  "tests/fixtures/tagger/treebank.tsv",
  "data/entities/html5.tsv",
]

# Word endings in the syllable rules of `src/readability.rs`.
[default.extend-words]
ful = "ful"
ment = "ment"
thm = "thm"
# The `mor` of `mor'n`, a contraction in the Treebank tokenizer of `src/tagger/treebank.rs`.
mor = "mor"
# The misspelt key `accpt:` that the `yaml-vocabularies` change tests is meant to be wrong.
accpt = "accpt"
# The stems of the verbs that take a clause, which `COMPLEMENT_STEMS` in `src/tagger/corrections.rs` matches as prefixes.
believ = "believ"
assum = "assum"
imagin = "imagin"
decid = "decid"
