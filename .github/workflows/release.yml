name: Release

# verctl's reusable release workflow, on every push to main and on demand.
# It releases each version at HEAD whose release is incomplete.
#
# First it makes a draft GitHub Release with the tarballs .ctl/ver.yaml
# declares, each built on its own hosted runner. Then it publishes the
# Release, and that creates the tag. Nothing goes to a registry
# (publisher: none). Last, it opens or updates the Version PR on
# verctl/release/main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release run at a time. A newer run waits instead of cancelling one that
# may be publishing. Each run releases every incomplete version at HEAD, so
# the queued run covers what any skipped one would have. The "-caller" part keeps
# this group apart from the called workflow's own group.
concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    permissions:
      contents: write # tags, Releases, assets, and verctl/release/main without the App
      pull-requests: write # the Version PR without the App
      id-token: write # every job of the reusable workflow requests it
    uses: victor-software-house/verctl/.github/workflows/release.yml@e06503d01ceb0b04ba50e2d234583f002db22951 # v0.8.6-rc.5
    with:
      mise-version: 2026.11.6
      mise-env: ci
    # The App token opens the Version PR so that its CI starts; a PR opened
    # with GITHUB_TOKEN starts no workflow.
    secrets:
      app-client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
