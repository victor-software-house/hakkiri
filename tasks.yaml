    blocked_by: []
    acceptance:
      - A case with format txt, in a rule's tests and in a test file, lints its input as plain text, and a test for each fails on the source before the change.
      - A formats entry of the config decides the reader of a case that runs through the config, and the test-command spec says so.
    plan: openspec/changes/test-plain-text/proposal.md
    notes:
      - '2026-11-11, found by the ProseStyle port: hakkiri test refused a case with format txt before HKR-030 and after it, so the package case that a text file is not prose could not run.'

  - id: HKR-031
    title: Turn rules off and on with comments
    scope: engine
    outcome: >-
      A comment in a file turns rules off and on for the text after it: Vale's off, on and per-rule comments, and hakkiri's own comments in the config's words.
    blocked_by: []
    acceptance:
      - Vale's off and on comments and its per-rule comments give the alerts Vale 66bbb85 gives on probes, in Markdown text and in HTML blocks.
      - Any alert that differs is fixed or recorded as an intended difference in the vale-differences spec.
      - 'hakkiri reads <!-- hakkiri off -->, <!-- hakkiri on -->, and <!-- hakkiri Style.Rule: off -->, on, or a level, with the same reach as the Vale form.'
      - The instructions and README show the hakkiri form first.
    notes:
      - '2026-11-10, found while reading HTML-block text: hakkiri has no comment control, so a vale off comment turns nothing off and the text after it is linted.'
      - '2026-11-11, operator decision: hakkiri reads both the vale and the hakkiri comments, prefers its own, and its own use the words of .ctl/hakkiri.yaml. The consumers use only the per-rule form today: 58 tags in one private repository, 4 in nishiki, 2 in hakkiri and 2 in prose-style; the rollout pull requests rewrite them to the hakkiri form.'
    plan: openspec/changes/comment-controls/proposal.md

  - id: HKR-009
    title: Switch the template to hakkiri
    scope: template
    outcome: >-
      The lint_prose piece runs hakkiri from mise and a pre-commit hook, with no Vale
      left.
    blocked_by:
      - HKR-008
      - HKR-043
      - HKR-044
      - HKR-030
      - HKR-031
    acceptance:
      - The templates Template check passes, and one pilot project passes CI on its update.
      - The lint_prose piece renders .ctl/hakkiri.yaml with level warning, the ProseStyle url and sha256 from the pins, styles [] for each generated path, and fail_level from prose_fail_level; mise installs hakkiri; .vale.ini, .vale/.gitignore, prose:sync and the Vale pin are gone.
      - 'Every repository that runs Vale today runs hakkiri through a merged update pull request: nishiki, verctl and three private repositories through the template; ctl-core and two private repositories by hand; and the local editor hook too.'
    notes:
      - '2026-11-11, operator decision: the switch is orchestrated with the templates repository. Order: hakkiri closes HKR-043, HKR-044, HKR-030 and HKR-031 and releases; prose-style tags v0.0.16 (HKR-008); the template change is tagged and piloted on hakkiri; then one update pull request per consumer, each moving its .vale.ini sections into .ctl/hakkiri.yaml and its vale comments to the hakkiri form.'
      - 2026-11-11, the local editor hook sends text on standard input with --ext=.md, which hakkiri does not read; it writes a temporary .md file instead, or a later row adds standard input.

  - id: HKR-041
    title: Read YAML vocabularies
