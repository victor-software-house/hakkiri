  - id: HKR-021
    title: Read the text inside HTML blocks as prose
    scope: tree
    outcome: Text inside an HTML block is linted as prose, with the scope Vale gives it.
    notes:
      - 2026-11-10, Vale lints the text of an HTML block with the scope of its block. hakkiri reads an HTML block as markup and lints none of it, so Vale gives alerts there that hakkiri does not.
      - '2026-11-10, reading it needs three behaviours of Vale checked first, and none is checked yet: unescaping HTML entities, masking the text of code, tt, kbd and samp, and handling pre.'
      - 2026-11-10, Vale lints the text after a closed raw-text tag on the same line, such as `<style></style > x` and `<style></style/> x`, and after `--!>` in a comment block. hakkiri keeps that text as HTML, from the CommonMark end condition of the block.
      - 2026-11-10, the operator decided hakkiri reads HTML-block text as prose as Vale does; it is a gap to close (operator, 2026-11-10).
    plan: openspec/changes/archive/2026-11-10-html-block-text/proposal.md
    completed: 2026-11-11T02:59:14
    evidence:
