# yaml-language-server: $schema=https://raw.githubusercontent.com/victor-software-house/qctl/main/schema/tasks.schema.json
schema_version: 5
prefix: HKR
active: HKR-003
queue:
  - id: HKR-003
    title: Build the document tree and language profiles
    scope: tree
    outcome: >-
      Markdown, MDX, and Rust, TypeScript and JavaScript comments parse into one node
      tree with byte spans.
    blocked_by: []
    acceptance:
      - Snapshot tests show trees and spans for block comments, strings holding URLs, nested lists, tables and MDX.
      - String literals never appear as prose nodes.
    plan: openspec/changes/document-tree/proposal.md

  - id: HKR-004
    title: Build the rule engine
    scope: engine
    outcome: >-
      Rules select text by scope, then run every Vale check type except script, with rates through metric.
    blocked_by: []
    acceptance:
      - Each check type has unit tests.
      - Flesch-Kincaid matches Vale on the prose-style fixtures within a stated tolerance.
      - A 50,000-character line and a 60,000-line file finish with no panic.
    notes:
      - 2026-11-09, a word count reads a code span as one word, where Vale 3.26.0 reads none; link text counts and its target does not, as in Vale. HKR-002 lists the intended differences.

  - id: HKR-005
    title: Ship the check and test commands
    scope: cli
    outcome: >-
      hakkiri check lints files in parallel and hakkiri test runs rule cases,
      released as binaries through verctl.
    blocked_by:
      - HKR-003
      - HKR-004
    acceptance:
      - Integration tests cover line and JSON output, exit status by level, and .ctl/hakkiri.yaml globs and levels.
      - JSON output holds no ESC byte with CLICOLOR_FORCE=1.
      - A verctl Version PR publishes a release that mise installs.

  - id: HKR-006
    title: Fetch and cache rule packages
    scope: packages
    outcome: >-
      A project pins rule packages by version and hash, and check fetches them with
      no sync step.
    blocked_by:
      - HKR-005
    acceptance:
      - Tests cover the first fetch, a cache hit and a hash mismatch.

  - id: HKR-007
    title: Import Vale styles
    scope: import
    outcome: >-
      hakkiri import vale converts every Vale rule type except script into the format.
    blocked_by:
      - HKR-005
    acceptance:
      - Each converted Voices, Std and Readability rule passes the cases from its own Vale file.

  - id: HKR-008
    title: Run ProseStyle on hakkiri
    scope: prose-style
    outcome: >-
      prose-style publishes a hakkiri package with its own rules, the converted
      upstream styles and the rate rules.
    blocked_by:
      - HKR-006
      - HKR-007
    acceptance:
      - Every rule case and package case passes under hakkiri test.
      - An alert diff against Vale with ProseStyle 0.0.7 over our public repositories shows only the intended differences.

  - id: HKR-009
    title: Switch the template to hakkiri
    scope: template
    outcome: >-
      The lint_prose piece runs hakkiri from mise and a pre-commit hook, with no Vale
      left.
    blocked_by:
      - HKR-008
    acceptance:
      - The templates Template check passes, and one pilot project passes CI on its update.

  - id: HKR-010
    title: Release 1
    scope: release
    outcome: Projects that used Vale with ProseStyle run hakkiri instead.
    blocked_by:
      - HKR-009
    acceptance:
      - Every adopted project passes CI on hakkiri.
archive:
  - id: HKR-002
    title: Design the rule and config format
    scope: format
    outcome: >-
      One approved spec defines the rule files and .ctl/hakkiri.yaml before any
      engine code.
    plan: openspec/changes/archive/2026-11-10-rule-format/proposal.md
    completed: 2026-11-10T06:51:07
    evidence:
      - The rule-format change merged in PR 3 and PR 4 at 4646cb0 and is archived.
    disposition: completed

  - id: HKR-001
    title: Scaffold the repository
    scope: repo
    outcome: >-
      The repository holds the template render, the work queue, OpenSpec, and the
      research and decisions behind the plan.
    plan: openspec/changes/archive/2026-11-09-bootstrap-hakkiri/proposal.md
    completed: 2026-11-09T17:42:10
    evidence:
      - Repository, template render, queue and the bootstrap-hakkiri OpenSpec change merged in PR 1.
    disposition: completed
horizon:
  - id: HKR-011
    title: Serve alerts and fixes in editors
    scope: lsp
    outcome: hakkiri lsp shows alerts and offers swap fixes in editors.
    kind: deferred
    open: Release 1 has not shipped.
