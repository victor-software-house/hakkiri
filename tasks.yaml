  - id: HKR-055
    title: Select the text of a scope once for every rule that reads it
    scope: engine
    outcome: >-
      A run with many rules over a long file splits and builds the text of each scope
      once, so the time of a rule is its own check and not the selection it shares
      with the others.
    blocked_by: []
    acceptance:
      - On a Markdown file of 12,000 lines the ProseStyle package takes at most half the 25 seconds it takes with hakkiri 0.0.5, measured in a box with the release binary.
      - A unit test counts the selections of three rules with one scope and finds one, and fails on the source before the change.
    notes:
      - '2026-11-11, measured in a box with optimized builds: ProseStyle v0.0.14 on Vale built from 66bbb85 took 355 s on a Markdown file of 12,000 lines, and the package on hakkiri 0.0.5 took 25 s. hakkiri is 14 times faster, and the operator wants it faster everywhere.'
      - '2026-11-11, the time grows by 0.4 to 0.5 s for each rule that reads the sentence, text or paragraph scope: 1, 5 and 10 sentence rules that match nothing took 1.2, 3.1 and 5.6 s, and 1, 5 and 10 raw rules took 0.7 s each time. The package with 20, 40 and 75 rules took 7.5, 13.7 and 28 s. engine.rs calls select once for each rule, so each rule splits the sentences and builds the text of the same blocks again.'
      - 2026-11-11, with one selection for each scope, a release build of the branch ran the package on the same file in 5.5 s with the same 24,490 alerts, against 25.3 s for the 0.0.5 release binary on the same box. That is 4.6 times faster, and 65 times faster than Vale at 66bbb85 on the v0.0.14 rules.

  - id: HKR-058
    title: Build the text of a long block in time that grows with its length
    scope: engine
    outcome: >-
      The text of a block with many segments and many code spans or links builds in
      time that grows with their number, so a long paragraph costs no more than the same
      lines in short ones.
    blocked_by: []
    acceptance:
      - A unit test builds a text of 100,000 segments with a code span in each, and fails on the source before the change by taking over two seconds.
      - On a Markdown file of 12,000 lines in one paragraph the ProseStyle package takes at most 2 seconds with a release build, and gives the same alerts as before.
    notes:
      - '2026-11-11, found by profiling the package on that file: the selection of a scope took 4.1 s of the 5.3 s of the engine, and the six selections that build the text of the one paragraph took 0.37 to 0.8 s each. Text::build looped over every replacement for each segment and tested every replacement at each line break, so its time grew with the segments times the code spans and links of the block (24,000 spans for 12,000 segments).'
      - 2026-11-11, with binary searches over the replacements, which lie in file order with no overlap, a release build ran the package on the same file in 1.8 s with the same 24,490 alerts, against 5.8 s for the build before it and 24.6 s for the 0.0.5 release binary.

  - id: HKR-056
    title: Give no alert for a code span read as the noun of a verb
    scope: sequence
    outcome: >-
      A sequence rule that reads a noun before a verb gives no alert when the noun is
      a code span, whichever tool masks it.
    blocked_by: []
    acceptance:
      - A ThingsSpeakNoun case with a code span before says gives no alert under hakkiri, with a test.
      - The vale-differences spec lists the difference, since Vale gives the alert on the mask.
      - The sequence-check spec states that no token names a code span and a negated token holds at it, with tests.
      - The alert diff of nine repositories is judged by hand, and each true alert it loses is listed.
    notes:
      - '2026-11-12, found by judging the ThingsSpeakNoun alerts of nine repositories: 22 of 80 alerts that only hakkiri gives read a code span as x before says, asks or agrees, and 13 of the 18 that only Vale gives read the mask as a noun. Both are false, since code is not prose.'
      - '2026-11-12, the change removes 72 alerts of nine repositories, 41 NounStack and 31 ThingsSpeakNoun, and adds none. 64 are false, and 8 name a prose noun that speaks, with a code span between it and the verb, so they are lost: a scenario or a notice that says, a check that agrees, a marker that says.'
      - '2026-11-12, the change lets a code span stand for the noun that a preposition before it attaches it to, so the run lands on the prose noun. Against the stack top before the code-span change it removes 72 alerts and adds 17: 64 removed are false, 12 added are true and 5 added are false.'
      - 'Three true alerts stay lost: the scenario `Orphans after a crash` that said, the scenario `A blob file deleted by hand` that says, and the `UNIQUE` check on `session.dir` that agrees. A noun right before the span cannot stand for it, since the snapshot `request` asks for reads like the scenario `A` says.'
    plan: openspec/changes/code-span-tokens/proposal.md

  - id: HKR-057
    title: Make the NounStack pattern match its text
    scope: package
    outcome: >-
      NounStack alerts on lowercase nouns only, as its text says, in hakkiri and in
      Vale.
    blocked_by: []
    acceptance:
      - The pattern of the NounStack token counts a word only when it is lowercase from its first to its last letter, so a capitalised name such as GitHub or AMD does not count as a noun of a stack, with a case.
    notes:
      - The result of judging 100 alerts only Vale gives, by the rule text, is 3 true and, with a capitalised noun counted, 15 true. The 100 that only hakkiri gives hold 10 true by either reading.
      - '2026-11-12, an anchor cannot do it: with the pattern ^[a-z][a-z-]*$ neither hakkiri 0.0.5 nor Vale 3.26.0 matches The session lake store path is long., because the pattern is not matched against the token alone. A lookaround, (?<![A-Za-z])[a-z][a-z-]*(?![A-Za-z]), gives the same result in both tools, and the package branch carries it with a case for a stack of capitalised names.'
      - '2026-11-12, found by judging the NounStack alerts of nine repositories: the text of the rule says each noun is a lowercase word, but the pattern [a-z][a-z-]* matches the lowercase letters inside a capitalised name, so both tools count GitHub as a noun of a stack.'
