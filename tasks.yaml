  - id: HKR-049
    title: Lint front matter values
    scope: markdown
    outcome: The values in a Markdown file's front matter are linted as text, as Vale does.
    blocked_by: []
    acceptance:
      - A text rule reports a word in a front matter value, with the alerts Vale 66bbb85 gives on the probe files in tests/fixtures/front-matter, less the nine alerts Vale places at the wrong text.
      - The values of YAML and TOML front matter come from ctl-core Input::top_level, and no line reader of our own reads them.
    notes:
      - '2026-11-11, found while probing comment controls: Vale flags the word very in the title value of a front matter block, and hakkiri skips the whole block. The probe is tests/fixtures/markup-differences/text/m2.md. Which keys Vale lints is not measured yet.'
      - '2026-11-12, measured on Vale 66bbb85 over ten files and three configs (590 alerts): it lints the top-level string values only, as the front-matter spec lists, and places 4 alerts at the wrong text per config: the second line of a folded scalar, a TOML value found by searching the block, and a !!str value.'
      - 2026-11-12, an earlier reader of our own (PR 106, reverted in PR 113) skipped anchors, aliases and complex keys. The rebuild reads YAML and TOML through ctl-core Input::top_level, and only dates and the plain value << need a filter in hakkiri, since yaml.v3 reads them as no string and serde-saphyr as one.
      - '2026-11-12, measured in a box: the release binary grew from 14,375,208 to 15,038,184 bytes (662,976, 4.6%) with ctl-core 0.7.3 and its input-toml feature, which adds the toml crate.'
      - '2026-11-12, ctl-core 0.7.3 refused a whole YAML block that held a repeated key, a merge key, .inf, -.inf or .NaN as a value, and left out a number or null key, where Vale lints the other values. ctl-core 0.7.4 (CTC-055) lists them all, so the probe file f7 holds its three original values again, and f11 to f15 record the 306 more alerts of Vale for an alias, a repeated key, a merge key, number and null keys and the three non-finite floats.'
      - '2026-11-12, Vale fails a file whose front matter no parser reads, and a sequence key as well, with E201 on line 1, and lints none of it. hakkiri fails the file with the line of the parser problem and lints the rest, and lints the rest of a block with a sequence key, which a parser reads. Vale puts a value after an anchor at the anchor, as it does after a tag, so the four misplaced alerts per config are nine.'
    plan: openspec/changes/front-matter-values/proposal.md

  - id: HKR-051
    title: Count code spans in LongSentence under hakkiri
    scope: prose-style
    outcome: >-
      ProseStyle's LongSentence fails a sentence over 40 words with each code span
      counted once when hakkiri runs it.
    blocked_by: []
    acceptance:
      - The ProseStyle LongSentence case 'counts each code span as a word' passes under hakkiri test, with the rule written in a form hakkiri counts.
    notes:
      - "2026-11-11, found by the ProseStyle port: v0.0.14 LongSentence is an occurrence rule whose token (?:\\b\\w+\\b|\\*+) counts Vale's mask of a code span, a run of asterisks. hakkiri has no mask and an occurrence counts no match that overlaps a code span, so it counts 3 words in Run `a`, `b`, `c` and `one two three` today, where Vale counts 7."
      - '2026-11-11, decision: the engine stays as the match-checks spec states, since a metric words rule counts each code span once. The rule moves to a metric words form, with its message and cases, in the prose-style package.'
      - '2026-11-12, operator decision: a setting code_span_size sets how many words a code span counts as, 1 by default and 0 as Vale counts it. HKR-063 builds it in the same change, now named code-span-size.'
    plan: openspec/changes/code-span-size/proposal.md

  - id: HKR-052
    title: Correct the tags that the model gets wrong on our prose
    scope: tagger
    outcome: >-
      hakkiri reads the cases that the model tags wrongly on our prose as the old model does, so NounStack and ThingsSpeakNoun give no alert for a verb read as a noun.
    blocked_by: []
    acceptance:
      - A test per correction pins the tags of a possessive, a modal in capitals, a name in capitals, a semicolon and a verb after a noun phrase, and fails on the source before the change.
      - The corrected tags match UD English GUM at least as well as the model alone, 92.16%.
      - On the 200 judged conflicts of our documents the corrected tags are right at least as often as the old model.
      - The corrections remove no true NounStack or ThingsSpeakNoun alert, judged by hand, and add none.
      - The vale-differences spec lists the corrections with their numbers.
    notes:
      - "2026-11-11, found by the ProseStyle port: hakkiri's tagger is faithful to prose at b33e60d, the version Vale 66bbb85 builds on, and gives the tags a Go program on that version gives. Vale 3.26.0 ships prose v3.2.2, whose model is older (3,411,804 bytes, the bytes feature template, MIT) and tags 'reads' in 'The freshness harness reads stdout.' as VBZ, where the b33e60d model (1,877,993 bytes, UD English EWT, CC BY-SA 4.0, the runes template) gives NNS."
      - '2026-11-11, on 1,296 sentences of our documents the two models give a different tag for 3,395 of 18,431 tokens, 18.4%. The most common changes from the older to the newer are JJ to NN (545), NNS to VBZ (405) and VBZ to NNS (128). Two ways to close it: ship the v3.2.2 model, with the bytes template that hakkiri does not read yet, or keep the model and accept the difference in the vale-differences spec.'
      - '2026-11-12, decided by the lead: keep the b33e60d model and correct its tags after it, each correction a rule with a reason, not a second model. UD English GUM gives 92.16% for the model and 90.26% for the old one.'
      - 2026-11-12, of 200 conflicts drawn at random from our documents and judged by hand, the old model was right in 131 and the model alone in 103, counting a capital modal as right when it reads MD. The corrections bring the model to 140 and GUM to 92.53%.
      - 2026-11-12, the corrections removed 68 alerts of NounStack and ThingsSpeakNoun on nine repositories and added none. All 68 were false by hand, each a verb read as a plural noun.
      - Judged on the rule text, which asks for four lowercase nouns, hakkiri has more true NounStack alerts than Vale (about 30 against 14). If a capitalised noun counts, Vale has more (about 46), because the rule pattern is unanchored; HKR-057 records the mismatch.
      - ThingsSpeakNoun gives more true alerts under hakkiri and a precision 6 points lower, most of it from a code span read as the noun of a verb in both tools; HKR-056 records it.
    plan: openspec/changes/tag-corrections/proposal.md

  - id: HKR-054
    title: Read the title of a link as text
    scope: tree
    outcome: >-
      The title attribute of a Markdown link and of an image is a scope a rule can
      read, so a URL in a title draws the alert Vale gives it.
    blocked_by: []
    acceptance:
      - A scope for the title text of a link and of an image selects it, with a case in the scope-selection spec and a test that fails on the source before the change.
      - The ProseStyle v0.0.14 BareURL case for a URL in a link title gives the same alert under hakkiri as under Vale, with the rule reading the new scope.
    notes:
      - '2026-11-11, found by the BareURL comparison of the ProseStyle port: on 24 planted Markdown shapes hakkiri and Vale 3.26.0 with the v0.0.14 rules alerted on the same lines except two. hakkiri flags a URL in plain parentheses or double quotes that v0.0.14 passes, which is right. v0.0.14 flags the URL in [t](https://a.example/a "see https://b.example/b"), a link title, which no scope hakkiri reads holds.'
    plan: openspec/changes/link-title/proposal.md

  - id: HKR-058
    title: Build the text of a long block in time that grows with its length
    scope: engine
    outcome: >-
      The text of a block with many segments and many code spans or links builds in
      time that grows with their number, so a long paragraph costs no more than the same
      lines in short ones.
    blocked_by: []
    acceptance:
      - A unit test builds a text of 100,000 segments with a code span in each, and fails on the source before the change by taking over two seconds.
      - On a Markdown file of 12,000 lines in one paragraph the ProseStyle package takes at most 2 seconds with a release build, and gives the same alerts as before.
    notes:
      - '2026-11-11, found by profiling the package on that file: the selection of a scope took 4.1 s of the 5.3 s of the engine, and the six selections that build the text of the one paragraph took 0.37 to 0.8 s each. Text::build looped over every replacement for each segment and tested every replacement at each line break, so its time grew with the segments times the code spans and links of the block (24,000 spans for 12,000 segments).'
      - 2026-11-11, with binary searches over the replacements, which lie in file order with no overlap, a release build ran the package on the same file in 1.8 s with the same 24,490 alerts, against 5.8 s for the build before it and 24.6 s for the 0.0.5 release binary.

  - id: HKR-056
    title: Read a code span as a noun in a sequence rule
    scope: sequence
    outcome: >-
      A sequence rule reads a code span as a noun: a rule of a noun and a verb flags a code name that says, and a rule for four lowercase nouns counts none.
    blocked_by: []
    acceptance:
      - A ThingsSpeakNoun case with a code span before says gives an alert under hakkiri, and a NounStack case with a code span in a stack gives none, with tests.
      - The sequence-check spec states that a code span has the tag NN and reads as the letter X, with tests.
      - The vale-differences spec lists the difference, since Vale reads the span as a run of stars.
      - The alerts that Vale and hakkiri do not all give are labelled against a written definition of each rule by two readers, and each false alert that remains is listed.
      - The package puts a verb tag on the verb token of ThingsSpeakNoun, the tagger reads a noun, a participle and a verb of saying by the place it stands in, and each correction has a test and keeps GUM at 92.53% or above.
    notes:
      - 2026-11-12, the alerts of ThingsSpeakNoun and NounStack that the tools do not all give were labelled by two readers each, 304 and 550. By the definitions a code name before says is a thing that speaks, so the refusal of the span removed 64 false and 8 true alerts and left 44 of 268 true ones. The two readers of the 415 NounStack alerts that no code span touches differed on 9, all a hyphenated word before three nouns, settled as false since a hyphenated word is an adjective.
      - 2026-11-12, reading the span as a noun gave 264 true and 26 false alerts of ThingsSpeakNoun, 20 of the 26 the noun ask or asks and 6 a participle. The verb tag alone cut 34 true alerts and 4 of Vale's, so the tagger corrections for the verbs of saying and asking were added. The result is 274 true and 7 false, all 21 true alerts of Vale, and GUM at 92.54% against 92.53%. 3 of the 7 false are participles that the package's rule removes, 3 are asked to end twice and asked online, where only the thing that is asked tells the participle from a past tense, and 1 is a literal verb that Vale also flags.
    plan: openspec/changes/code-span-tokens/proposal.md

  - id: HKR-057
    title: Make the NounStack pattern match its text
    scope: package
    outcome: >-
      NounStack alerts on lowercase nouns only, as its text says, in hakkiri and in
      Vale.
    blocked_by: []
    acceptance:
      - The pattern of the NounStack token counts a word only when it is lowercase from its first to its last letter, so a capitalised name such as GitHub or AMD does not count as a noun of a stack, with a case.
    notes:
      - The result of judging 100 alerts only Vale gives, by the rule text, is 3 true and, with a capitalised noun counted, 15 true. The 100 that only hakkiri gives hold 10 true by either reading.
      - '2026-11-12, an anchor cannot do it: with the pattern ^[a-z][a-z-]*$ neither hakkiri 0.0.5 nor Vale 3.26.0 matches The session lake store path is long., because the pattern is not matched against the token alone. A lookaround, (?<![A-Za-z])[a-z][a-z-]*(?![A-Za-z]), gives the same result in both tools, and the package branch carries it with a case for a stack of capitalised names.'
      - '2026-11-12, found by judging the NounStack alerts of nine repositories: the text of the rule says each noun is a lowercase word, but the pattern [a-z][a-z-]* matches the lowercase letters inside a capitalised name, so both tools count GitHub as a noun of a stack.'

  - id: HKR-059
    title: Set rule parameters from the config
    scope: config
    outcome: >-
      A glob sets a scalar parameter of a rule by name, as Vale does with
      Style.Rule.param.
    blocked_by: []
    acceptance:
      - A glob that sets Vale.Repetition.max to 1 lets one repeat pass and reports the next, as Vale does, in a test against its alerts.
      - A parameter that Vale refuses, a level spelled as a parameter and a structural key such as tokens, is refused with the file and the line.
    notes:
      - "2026-11-12, found while probing Vale.Repetition at 66bbb85: ini.go asRuleParam stores Style.Rule.param = value, and defaultRule applies it when the rule compiles. hakkiri's config reads a level, on and off by rule name and no parameter."
      - 2026-11-12, the key Vale 66bbb85 reads is Style.Rule[param] = value, not Style.Rule.param, and it applies a parameter to every file whichever section sets it, with the last section winning everywhere. hakkiri applies it to the files of the glob that sets it, as the rule-parameters change records.
    plan: openspec/changes/rule-parameters/proposal.md

  - id: HKR-060
    title: Read a code span as one star in an existence rule
    scope: sequence
    outcome: >-
      An existence rule reads a code span as one star and drops a match only when it
      starts or ends on the span, so a match across a span is an alert, as in Vale.
    blocked_by: []
    acceptance:
      - An existence rule reads a code span as one * and drops a match only when it starts or ends on the span, with tests, so a match across a span is an alert as in Vale.
    plan: openspec/changes/existence-span-mask/proposal.md
    notes:
      - '2026-11-12, run_existence dropped each match that overlapped a code span, which cost about 400 true ClauseChain alerts of Vale. It now reads a span as one * and drops a match only when it starts or ends on the span: ClauseChain gives 1,536 alerts on nine repositories where it gave 1,020, and Vale gives 1,492, with none that only Vale gives. The 11 true alerts of Vale that hakkiri seemed to lack were one repository whose configuration the run converted wrongly, so no splitter explains them. Two readers labelled the 40 alerts that only hakkiri gives, 26 true and 14 false, each false one a list of items joined with semicolons, which Vale also gives in 46 of its 88 alerts that hakkiri lacked before; the package pattern cannot tell a list from a chain.'

  - id: HKR-061
    title: Read the nouns of technical prose as nouns
    scope: sequence
    outcome: >-
      The tagger reads check, prompt, thinking, fade, round and split as nouns in the
      places where the sampled readings are nouns, so NounStack gives every true alert
      of Vale.
    blocked_by: []
    acceptance:
      - The tagger reads check, prompt, thinking and fade as nouns after a determiner, prompt, round and split as nouns before pull request in a title, and check at the end of a compound, each word in a list only where the sampled readings are nouns, with tests and GUM at 92.53% or above, and NounStack gives every true alert of Vale.
    plan: openspec/changes/technical-nouns/proposal.md
    notes:
      - 2026-11-12, the tagger read check, split, round, prompt, fade and thinking as a verb, an adverb or an adjective inside a run of nouns, which cost NounStack 7 true alerts of Vale. nouns_of_technical_prose reads three lists of them as nouns, one for each place a noun is certain, with GUM at 92.54% and 134 of the 200 judged conflicts right against 133. Two readers labelled 530 places of the six words in nine repositories. After a determiner check, prompt, thinking and fade are nouns in 163 of 163, round in 41 of 50 and split in 40 of 50, so round and split left that list. NounStack now gives 240 alerts of the 558 the tools diverge on, 44 true and 196 false, where Vale gives 278, 16 true and 262 false, and every true alert of Vale.
      - 2026-11-12, 12 false NounStack alerts hold a hyphenated word before three nouns, which the pattern [a-z][a-z-]* accepts and the definition counts as an adjective. A tagger rule that reads a hyphenated word as an adjective cost 6 tokens of GUM, so the fix belongs to the package pattern.

