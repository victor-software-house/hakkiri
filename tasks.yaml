prefix: HKR
active: HKR-019
queue:
  - id: HKR-019
    title: Read vocabularies
    scope: config
    outcome: >-
      A project selects vocabularies whose accepted terms reach every check that reads them.
    blocked_by: []
    acceptance:
      - A project's config names vocabularies, and each is read from a package's accept.txt and reject.txt.
      - Accepted terms reach capitalization's vocab exceptions, added before the (?-i) rewrite, and the spelling check's accepted words.
      - A glob's vocab list adds its accepted terms to the files the glob matches, in the existence, repetition, spelling and substitution checks, in tests against Vale's recorded alerts.
    notes:
      - "2026-11-10, Vale adds the accepted terms to a capitalization rule's exceptions when its vocab is true, which is the default: https://github.com/vale-cli/vale/blob/66bbb85a1a78a5b5497331e04d4033357caced4d/internal/check/capitalization.go#L52-L70."
      - 2026-11-10, the case-and-sequence-checks change leaves capitalization's vocab with no effect, and the spelling check of the spelling-and-affix-checks change (task 1.1) reads accepted words from this row.
      - 2026-11-11, the rules Vale.Terms and Vale.Avoid, and the rules named for a glob's vocabularies, moved to HKR-042, because the spec of both went over the word budget of a change.
      - "2026-11-11, operator decision: the key is vocab, at the top level and in a glob of files, and a glob's list adds to the files it matches."
    plan: openspec/changes/vocabularies/proposal.md

  - id: HKR-042
    title: Build Vale.Terms and Vale.Avoid from a vocabulary
    scope: config
    outcome: >-
      The built-in style Vale holds Terms, which reports an accepted term written in
      another case, and Avoid, which reports a rejected term, with Vale's messages and
      levels.
    blocked_by:
      - HKR-019
    acceptance:
      - Accepted and rejected terms give the alerts that Vale's generated Vale.Terms and Vale.Avoid rules give, in tests against Vale's recorded alerts.
      - A glob that lists the style Vale, or sets Vale.Terms or Vale.Avoid by name, runs the rules at the level it sets, in a test.
      - A glob's vocabulary builds Vale.<Name>.Terms and Vale.<Name>.Avoid, which run on the files of that glob with no style or setting, in a test.
    plan: openspec/changes/vocabulary-rules/proposal.md

  - id: HKR-041
    title: Read YAML vocabularies
    scope: config
    outcome: >-
      A vocabulary folder may hold vocab.yml, whose accept and reject entries take
      the options regex, ignorecase and flags, as in Vale.
    blocked_by:
      - HKR-019
    acceptance:
      - A vocab.yml entry that is a term, or a term mapped to regex, ignorecase or flags, is read as Vale reads it, in tests against Vale's alerts.
      - An entry Vale refuses is refused with the file and the line, in a test for each fault.
    plan: openspec/changes/vocabularies/proposal.md

  - id: HKR-040
    title: Read a package's settings
    scope: config
    outcome: >-
      A package ships a settings file in hakkiri's own YAML format, and hakkiri
      merges it under the project's config, as Vale merges a package's .vale.ini. The
      project overrides the package.
    blocked_by:
      - HKR-019
    acceptance:
      - A package's settings file is read and merged under the project's config, and a setting in the project wins, in a test.
      - A rule the package sets off stays off until the project turns it on, in a test.
      - The package's vocab reaches the checks that read vocabularies, in a test.
      - A package's packages are fetched like the project's, each pinned by url and sha256, and a cycle and a chain over 10 packages are errors, in tests.
      - A project's styles list adds to a package's under the same glob and replaces it under another glob that matches the same files, in a test.
    plan: openspec/changes/package-settings/proposal.md
    notes:
      - "2026-11-11, operator decisions: the file is .ctl/hakkiri.yaml in the package; styles add up under the same glob text and a project list under another glob replaces the package's, with no warning; a package's packages are fetched, pinned by url and sha256, with a cycle refused and a depth limit of 10 (Vale sets none)."

  - id: HKR-008
    title: Run ProseStyle on hakkiri
    scope: prose-style
    outcome: >-
      prose-style publishes a hakkiri package with its own rules, the native ports of the upstream rules worth keeping, and the rate rules.
    blocked_by: [HKR-040]
    acceptance:
      - Every rule case and package case passes under hakkiri test.
      - An alert diff against Vale with ProseStyle v0.0.14 over our public repositories shows only the intended differences.
      - The 14 opt-in rules do not run until a project turns them on, in a test.
    notes:
      - '2026-11-11, operator decision: ProseStyle owns its rules. The 36 upstream rule files that ProseStyle.zip copies today (Voices, Direct, Readability, and the Abbreviations, DateTime, Grammar, Punctuation and Usage rules of Std) are reviewed one by one. Each valuable one becomes a native hakkiri rule in the one style ProseStyle, with tests, and the MIT sources are credited in a NOTICE. The rest are dropped with a reason. upstream.toml and the copying go.'
      - '2026-11-11, operator decision: from its next release ProseStyle.zip is the hakkiri package. Vale projects stay pinned to v0.0.14, and the templates pin stays there until HKR-009. There is no second asset.'
      - '2026-11-11, the six script rules of ProseStyle v0.0.14 (FlatRhythm, BareWorkItem, SameSentenceStart, HardBreak, SentencePerLine and PrepositionChain) port to native rules: five existence rules and one metric rule pass the 18 cases of the tag under hakkiri test in a probe. Readability.Polysyllables ports to one existence rule that gave the same 170,781 alerts as Vale 66bbb85 running the script over 238,342 words.'
      - "2026-11-11, operator decision, ports: ProseStyle takes 17 upstream rules that always run. They are Banned, BinaryContrast, InflatedWords, Puffery, Recap, SuperficialAnalysis, ThroatClearing, WeakVerbs and Weasel of Voices, Hedging, Length and Preamble of Direct, FleschKincaid of Readability, and Latin, Spacing, GenderedPronouns and GenderedTerms of Std. Fourteen more ship off through the package settings, for a project to turn on: AutomatedReadability, ColemanLiau, FleschReadingEase, GunningFog, LIX, SMOG, Polysyllables (an existence rule that gave the same alerts as Vale's script over 238,342 words), PassiveVoice, OxfordComma, Contractions, FirstPersonPlural, FirstPersonSingular, DateFormat and TimeFormat. ProseStyle then holds 44 + 31 = 75 rules."
      - "2026-11-11, operator decision, drops: ColonReveal, Ease, Acronyms (UndefinedAcronym covers it) and Ellipses (it flags the … that Emoji allows). Std's SentenceLength folds into Length."
      - '2026-11-11, operator decision, renames: Banned becomes SlopWords, Recap RecapOpener, Weasel VagueAttribution, Latin LatinAbbreviation, Spacing SentenceSpacing, Length SentenceLength and FleschKincaid GradeLevel. Hedging and Preamble keep their names, and every other port keeps its upstream name.'
      - "2026-11-11, operator decision, overlaps: no text draws two alerts for one fault. Drop 'harness the power' from StockPhrases, since SlopWords covers it, and make 'stands as a testament' draw only the Puffery alert. SentenceLength at 25 words as a suggestion beside LongSentence at 40 as an error stays by design."
      - '2026-11-11, operator decision: the opt-in rules ship off through a package settings file, so this row waits for HKR-040.'

