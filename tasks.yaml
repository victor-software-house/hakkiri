# yaml-language-server: $schema=https://raw.githubusercontent.com/victor-software-house/qctl/main/schema/tasks.schema.json
schema_version: 5
prefix: HKR
active: HKR-029
queue:
  - id: HKR-029
    title: Release hakkiri through verctl
    scope: release
    outcome: A verctl Version PR publishes a release of hakkiri, and mise installs it.
    blocked_by: []
    acceptance:
      - A verctl Version PR publishes 0.0.1 as a tag and a GitHub Release with a linux-x64 and a darwin-arm64 tarball and their checksums, and no crates.io crate.
      - mise installs the release on a Mac and on Linux x86-64 from a pinned version and a locked checksum.
    plan: openspec/changes/release-lane/proposal.md

  - id: HKR-033
    title: Enable one rule with a rule setting
    scope: config
    outcome: >-
      A glob that sets a rule of a style it does not list runs that rule at the level
      it names, as a rule setting does in Vale.
    blocked_by: []
    acceptance:
      - A probe of Vale 66bbb85 with a rule setting under a glob and no listing of its style gives the alerts hakkiri gives, in a test.
      - The vale-differences scenario for a rule setting is removed.
    notes:
      - '2026-11-11, found while scoping when a clash is refused: with BasedOnStyles naming only Other, Vale 66bbb85 runs Team.Terms for the setting Team.Terms = YES, and at level error for Team.Terms = error. hakkiri runs a rule only from a style a glob lists, so the same setting changes nothing there. Vale gave no clash or bracket error for the style when it was enabled that way: a style with Terms.yml and Terms.custom.yml ran Terms.yml, and a style with a Weird[max].yml file ran its Terms rule.'

  - id: HKR-006
    title: Fetch and cache rule packages
    scope: packages
    outcome: >-
      A project pins rule packages by version and hash, and check fetches them with
      no sync step.
    blocked_by: []
    acceptance:
      - Tests cover the first fetch, a cache hit and a hash mismatch.

  - id: HKR-019
    title: Read vocabularies
    scope: config
    outcome: >-
      A project selects vocabularies whose accepted and rejected terms reach every
      check that reads them.
    blocked_by:
      - HKR-006
    acceptance:
      - A project's config names vocabularies, and each is read from a package's accept.txt and reject.txt.
      - Accepted terms reach capitalization's vocab exceptions, added before the (?-i) rewrite, and the spelling check's accepted words.
      - Accepted and rejected terms give the alerts that Vale's generated Vale.Terms and Vale.Avoid rules give.
    notes:
      - "2026-11-10, Vale adds the accepted terms to a capitalization rule's exceptions when its vocab is true, which is the default: https://github.com/vale-cli/vale/blob/66bbb85a1a78a5b5497331e04d4033357caced4d/internal/check/capitalization.go#L52-L70."
      - 2026-11-10, the case-and-sequence-checks change leaves capitalization's vocab with no effect, and the spelling check of the spelling-and-affix-checks change (task 1.1) reads accepted words from this row.

  - id: HKR-007
    title: Import Vale styles
    scope: import
    outcome: >-
      hakkiri import vale converts every Vale rule type except script into the format.
    blocked_by: []
    acceptance:
      - Each converted Voices, Std and Readability rule passes the cases from its own Vale file.

  - id: HKR-008
    title: Run ProseStyle on hakkiri
    scope: prose-style
    outcome: >-
      prose-style publishes a hakkiri package with its own rules, the converted
      upstream styles and the rate rules.
    blocked_by:
      - HKR-006
      - HKR-007
    acceptance:
      - Every rule case and package case passes under hakkiri test.
      - An alert diff against Vale with ProseStyle 0.0.7 over our public repositories shows only the intended differences.

  - id: HKR-026
    title: Run Vale's built-in spelling rule
    scope: engine
    outcome: >-
      A project that enables Vale.Spelling gets its alerts from hakkiri, with Vale's default ignore list.
    blocked_by: []
    acceptance:
      - A rule named Vale.Spelling runs with the built-in dictionary and the default ignore list, and gives the alerts Vale 66bbb85 gives on the spelling parity inputs.
      - Any alert that differs is fixed or recorded as an intended difference in the vale-differences spec.

  - id: HKR-027
    title: Probe the Markdown parser against Vale's converter
    scope: tree
    outcome: >-
      The differences between hakkiri's Markdown parser and Vale's converter are
      measured on one corpus.
    blocked_by: []
    acceptance:
      - A corpus of Markdown inputs runs through hakkiri and Vale 66bbb85, and each text or scope that differs is listed.
      - Each difference found is fixed, or recorded as an intended difference in the vale-differences spec.
    notes:
      - '2026-11-10, found while matching HTML-block text: a Markdown paragraph `a*b*c` reads `abc` in hakkiri and `a bc` in Vale, which reads the HTML its converter writes, where an opening inline tag puts a space before its text. The corpus covers inline markup between letters.'

  - id: HKR-031
    title: Turn rules off and on with comments
    scope: engine
    outcome: >-
      A comment in a file turns rules off and on for the text after it, as the vale
      off and vale on comments and the per-rule comments of Vale do.
    blocked_by: []
    acceptance:
      - Vale's off and on comments and its per-rule comments give the alerts Vale 66bbb85 gives on probes, in Markdown text and in HTML blocks.
      - Any alert that differs is fixed or recorded as an intended difference in the vale-differences spec.
    notes:
      - '2026-11-10, found while reading HTML-block text: hakkiri has no comment control, so a vale off comment turns nothing off and the text after it is linted.'

  - id: HKR-030
    title: Lint plain-text files
    scope: engine
    outcome: A file that no language reads is linted as plain text, as Vale lints it.
    blocked_by: []
    acceptance:
      - A file with another extension, such as notes.txt, that a files glob matches is linted as plain text, and the vale-differences scenario for it is removed.

  - id: HKR-009
    title: Switch the template to hakkiri
    scope: template
    outcome: >-
      The lint_prose piece runs hakkiri from mise and a pre-commit hook, with no Vale
      left.
    blocked_by:
      - HKR-008
      - HKR-029
    acceptance:
      - The templates Template check passes, and one pilot project passes CI on its update.

  - id: HKR-010
    title: Release 1
    scope: release
    outcome: Projects that used Vale with ProseStyle run hakkiri instead.
    blocked_by:
      - HKR-009
    acceptance:
      - Every adopted project passes CI on hakkiri.
archive:
  - id: HKR-021
    title: Read the text inside HTML blocks as prose
    scope: tree
    outcome: Text inside an HTML block is linted as prose, with the scope Vale gives it.
    notes:
      - 2026-11-10, Vale lints the text of an HTML block with the scope of its block. hakkiri reads an HTML block as markup and lints none of it, so Vale gives alerts there that hakkiri does not.
      - '2026-11-10, reading it needs three behaviours of Vale checked first, and none is checked yet: unescaping HTML entities, masking the text of code, tt, kbd and samp, and handling pre.'
      - '2026-11-10, Vale lints the text after a closed raw-text tag on the same line, such as `<style></style > x` and `<style></style/> x`, and after `--!>` in a comment block. hakkiri keeps that text as HTML, from the CommonMark end condition of the block.'
      - 2026-11-10, the operator decided hakkiri reads HTML-block text as prose as Vale does; it is a gap to close (operator, 2026-11-10).
    plan: openspec/changes/archive/2026-11-10-html-block-text/proposal.md
    completed: 2026-11-11T02:59:14
    evidence:
      - openspec/changes/archive/2026-11-10-html-block-text/
    disposition: completed

  - id: HKR-032
    title: Name and load rule files as Vale does
    scope: rules
    outcome: >-
      A rule file is named by its path and loaded from its style folder as Vale does,
      so check, test and coverage give a file one name.
    plan: openspec/changes/archive/2026-11-10-rule-names/proposal.md
    notes:
      - '2026-11-10, hkr004-engine probed Vale 3.26.0: styles/Team/Terms.custom.yml is Team.Terms, and styles/Nest/Sub/Bar.yml is Nest.Sub.Bar in lint and in coverage. hakkiri cuts at the last dot and reads only the files directly in a style folder.'
      - 2026-11-10, the operator decided hakkiri matches Vale and cuts at the first dot, and refuses two files that end up with one name (operator, 2026-11-10).
    completed: 2026-11-11T02:59:14
    evidence:
      - openspec/changes/archive/2026-11-10-rule-names/
    disposition: completed

