  - id: HKR-049
    title: Lint front matter values
    scope: markdown
    outcome: The values in a Markdown file's front matter are linted as text, as Vale does.
    blocked_by: []
    acceptance:
      - A text rule reports a word in a front matter value, with the alerts Vale 66bbb85 gives on the probe files in tests/fixtures/front-matter, less the four alerts Vale places at the wrong text.
      - The values of YAML and TOML front matter come from ctl-core Input::top_level, and no line reader of our own reads them.
    notes:
      - '2026-11-11, found while probing comment controls: Vale flags the word very in the title value of a front matter block, and hakkiri skips the whole block. The probe is tests/fixtures/markup-differences/text/m2.md. Which keys Vale lints is not measured yet.'
      - '2026-11-12, measured on Vale 66bbb85 over ten files and three configs (590 alerts): it lints the top-level string values only, as the front-matter spec lists, and places 4 alerts at the wrong text per config: the second line of a folded scalar, a TOML value found by searching the block, and a !!str value.'
      - 2026-11-12, an earlier reader of our own (PR 106, reverted in PR 113) skipped anchors, aliases and complex keys. The rebuild reads YAML and TOML through ctl-core 0.7.3 Input::top_level, and only dates and the plain value << need a filter in hakkiri, since yaml.v3 reads them as no string and serde-saphyr as one.
      - '2026-11-12, measured in a box: the release binary grew from 14,375,208 to 15,038,184 bytes (662,976, 4.6%) with ctl-core 0.7.3 and its input-toml feature, which adds the toml crate.'
      - 2026-11-12, ctl-core 0.7.3 refuses a whole YAML block that holds .inf, -.inf or .NaN as a value, so no value of that block is linted, where Vale lints the others. The probe file f7 holds 3 where it held those three values, so the 590 alerts of Vale still hold line by line; the fix is in ctl-core (top_level reads under its own options).
    plan: openspec/changes/front-matter-values/proposal.md

  - id: HKR-051
    title: Count code spans in LongSentence under hakkiri
    scope: prose-style
    outcome: >-
      ProseStyle's LongSentence fails a sentence over 40 words with each code span
      counted once when hakkiri runs it.
    blocked_by: []
    acceptance:
      - The ProseStyle LongSentence case 'counts each code span as a word' passes under hakkiri test, with the rule written in a form hakkiri counts.
    notes:
      - "2026-11-11, found by the ProseStyle port: v0.0.14 LongSentence is an occurrence rule whose token (?:\\b\\w+\\b|\\*+) counts Vale's mask of a code span, a run of asterisks. hakkiri has no mask and an occurrence counts no match that overlaps a code span, so it counts 3 words in Run `a`, `b`, `c` and `one two three` today, where Vale counts 7."
      - '2026-11-11, decision: the engine stays as the match-checks spec states, since a metric words rule counts each code span once. The rule moves to a metric words form, with its message and cases, in the prose-style package.'
    plan: openspec/changes/code-span-words/proposal.md

  - id: HKR-052
    title: Correct the tags that the model gets wrong on our prose
    scope: tagger
    outcome: >-
      hakkiri reads the cases that the model tags wrongly on our prose as the old model does, so NounStack and ThingsSpeakNoun give no alert for a verb read as a noun.
    blocked_by: []
    acceptance:
      - A test per correction pins the tags of a possessive, a modal in capitals, a name in capitals, a semicolon and a verb after a noun phrase, and fails on the source before the change.
      - The corrected tags match UD English GUM at least as well as the model alone, 92.16%.
      - On the 200 judged conflicts of our documents the corrected tags are right at least as often as the old model.
      - The corrections remove no true NounStack or ThingsSpeakNoun alert, judged by hand, and add none.
      - The vale-differences spec lists the corrections with their numbers.
    notes:
      - "2026-11-11, found by the ProseStyle port: hakkiri's tagger is faithful to prose at b33e60d, the version Vale 66bbb85 builds on, and gives the tags a Go program on that version gives. Vale 3.26.0 ships prose v3.2.2, whose model is older (3,411,804 bytes, the bytes feature template, MIT) and tags 'reads' in 'The freshness harness reads stdout.' as VBZ, where the b33e60d model (1,877,993 bytes, UD English EWT, CC BY-SA 4.0, the runes template) gives NNS."
      - '2026-11-11, on 1,296 sentences of our documents the two models give a different tag for 3,395 of 18,431 tokens, 18.4%. The most common changes from the older to the newer are JJ to NN (545), NNS to VBZ (405) and VBZ to NNS (128). Two ways to close it: ship the v3.2.2 model, with the bytes template that hakkiri does not read yet, or keep the model and accept the difference in the vale-differences spec.'
      - '2026-11-12, decided by the lead: keep the b33e60d model and correct its tags after it, each correction a rule with a reason, not a second model. UD English GUM gives 92.16% for the model and 90.26% for the old one.'
      - 2026-11-12, of 200 conflicts drawn at random from our documents and judged by hand, the old model was right in 131 and the model alone in 103, counting a capital modal as right when it reads MD. The corrections bring the model to 140 and GUM to 92.53%.
      - 2026-11-12, the corrections removed 68 alerts of NounStack and ThingsSpeakNoun on nine repositories and added none. All 68 were false by hand, each a verb read as a plural noun.
      - Judged on the rule text, which asks for four lowercase nouns, hakkiri has more true NounStack alerts than Vale (about 30 against 14). If a capitalised noun counts, Vale has more (about 46), because the rule pattern is unanchored; HKR-057 records the mismatch.
      - ThingsSpeakNoun gives more true alerts under hakkiri and a precision 6 points lower, most of it from a code span read as the noun of a verb in both tools; HKR-056 records it.
    plan: openspec/changes/tag-corrections/proposal.md

