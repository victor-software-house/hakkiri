# yaml-language-server: $schema=https://raw.githubusercontent.com/victor-software-house/qctl/main/schema/tasks.schema.json
schema_version: 5
prefix: HKR
active: HKR-022
queue:
  - id: HKR-022
    title: List every difference from Vale in one place
    scope: docs
    outcome: One current list in openspec/specs names every intended difference from Vale.
    blocked_by: []
    acceptance:
      - The list names each difference recorded in the archived designs (rule-format decision 7, rule-engine, pattern-and-readability, case-and-sequence) and the spelling refusal of exceptions and threshold, each with a link to its decision.
      - Every later change that adds a difference updates the list in the same pull request.
    plan: openspec/changes/vale-differences/proposal.md

  - id: HKR-023
    title: List the check and refusal differences from Vale
    scope: docs
    outcome: >-
      The vale-differences spec lists how the pattern checks differ from Vale and
      each rule that hakkiri refuses where Vale loads it.
    blocked_by: []
    acceptance:
      - Each difference in the pattern-and-readability, case-and-sequence and spelling-and-affix designs that is a pattern-check difference or a refusal is a scenario with a link to its decision.
    plan: openspec/changes/vale-differences-checks/proposal.md

  - id: HKR-024
    title: List the reader and resource-use differences from Vale
    scope: docs
    outcome: >-
      The vale-differences spec lists how the ported readers differ from Vale and
      each input on which a run finishes in hakkiri and fails or stalls in Vale.
    blocked_by: []
    acceptance:
      - Each reader difference and each resource-use difference in the case-and-sequence and spelling-and-affix designs, and the regex limit of the rule-engine and bootstrap designs, is a scenario with a link to its decision.
      - The spec lists each known gap apart from the differences, with its queue row, and a language other than English as an intended difference.
    plan: openspec/changes/vale-differences-readers/proposal.md

  - id: HKR-025
    title: List the format and configuration differences from Vale
    scope: docs
    outcome: >-
      The vale-differences spec lists how comments, rule files, configuration and
      packages differ from Vale.
    blocked_by: []
    acceptance:
      - Each decision of the rule-format, rule-engine and bootstrap designs that differs from Vale in behaviour, checked against Vale by source and probe, is a scenario with a link to its decision.
    plan: openspec/changes/vale-differences-format/proposal.md

  - id: HKR-005
    title: Ship the check and test commands
    scope: cli
    outcome: >-
      hakkiri check lints files in parallel and hakkiri test runs rule cases,
      released as binaries through verctl.
    blocked_by: []
    acceptance:
      - Integration tests cover line and JSON output, exit status by level, and .ctl/hakkiri.yaml globs and levels.
      - JSON output holds no ESC byte with CLICOLOR_FORCE=1.
      - A verctl Version PR publishes a release that mise installs.

  - id: HKR-006
    title: Fetch and cache rule packages
    scope: packages
    outcome: >-
      A project pins rule packages by version and hash, and check fetches them with
      no sync step.
    blocked_by:
      - HKR-005
    acceptance:
      - Tests cover the first fetch, a cache hit and a hash mismatch.

  - id: HKR-019
    title: Read vocabularies
    scope: config
    outcome: >-
      A project selects vocabularies whose accepted and rejected terms reach every
      check that reads them.
    blocked_by:
      - HKR-005
      - HKR-006
    acceptance:
      - A project's config names vocabularies, and each is read from a package's accept.txt and reject.txt.
      - Accepted terms reach capitalization's vocab exceptions, added before the (?-i) rewrite, and the spelling check's accepted words.
      - Accepted and rejected terms give the alerts that Vale's generated Vale.Terms and Vale.Avoid rules give.
    notes:
      - "2026-11-10, Vale adds the accepted terms to a capitalization rule's exceptions when its vocab is true, which is the default: https://github.com/vale-cli/vale/blob/66bbb85a1a78a5b5497331e04d4033357caced4d/internal/check/capitalization.go#L52-L70."
      - 2026-11-10, the case-and-sequence-checks change leaves capitalization's vocab with no effect, and the spelling check of the spelling-and-affix-checks change (task 1.1) reads accepted words from this row.

  - id: HKR-007
    title: Import Vale styles
    scope: import
    outcome: >-
      hakkiri import vale converts every Vale rule type except script into the format.
    blocked_by:
      - HKR-005
    acceptance:
      - Each converted Voices, Std and Readability rule passes the cases from its own Vale file.

  - id: HKR-008
    title: Run ProseStyle on hakkiri
    scope: prose-style
    outcome: >-
      prose-style publishes a hakkiri package with its own rules, the converted
      upstream styles and the rate rules.
    blocked_by:
      - HKR-006
      - HKR-007
    acceptance:
      - Every rule case and package case passes under hakkiri test.
      - An alert diff against Vale with ProseStyle 0.0.7 over our public repositories shows only the intended differences.

  - id: HKR-021
    title: Read the text inside HTML blocks as prose
    scope: tree
    outcome: Text inside an HTML block is linted as prose, with the scope Vale gives it.
    notes:
      - 2026-11-10, Vale lints the text of an HTML block with the scope of its block. hakkiri reads an HTML block as markup and lints none of it, so Vale gives alerts there that hakkiri does not.
      - '2026-11-10, reading it needs three behaviours of Vale checked first, and none is checked yet: unescaping HTML entities, masking the text of code, tt, kbd and samp, and handling pre.'
      - '2026-11-10, Vale lints the text after a closed raw-text tag on the same line, such as `<style></style > x` and `<style></style/> x`, and after `--!>` in a comment block. hakkiri keeps that text as HTML, from the CommonMark end condition of the block.'
      - 2026-11-10, the operator decided hakkiri reads HTML-block text as prose as Vale does; it is a gap to close (operator, 2026-11-10).
    blocked_by: []
    acceptance:
      - Text inside an HTML block gets the alerts Vale 66bbb85 gives it, with the scope Vale gives it, on a fixture probed against Vale.
      - Entity unescaping, the masking of code, tt, kbd and samp text, and the handling of pre match Vale on probes.
      - The text after a closed raw-text tag on the same line and after --!> in a comment block gets the alerts Vale gives it, or a departure records why not.

  - id: HKR-026
    title: Run Vale's built-in spelling rule
    scope: engine
    outcome: >-
      A project that enables Vale.Spelling gets its alerts from hakkiri, with Vale's default ignore list.
    blocked_by: []
    acceptance:
      - A rule named Vale.Spelling runs with the built-in dictionary and the default ignore list, and gives the alerts Vale 66bbb85 gives on the spelling parity inputs.
      - Any alert that differs is fixed or recorded as an intended difference in the vale-differences spec.

  - id: HKR-027
    title: Probe the Markdown parser against Vale's converter
    scope: tree
    outcome: >-
      The differences between hakkiri's Markdown parser and Vale's converter are
      measured on one corpus.
    blocked_by: []
    acceptance:
      - A corpus of Markdown inputs runs through hakkiri and Vale 66bbb85, and each text or scope that differs is listed.
      - Each difference found is fixed, or recorded as an intended difference in the vale-differences spec.

  - id: HKR-009
    title: Switch the template to hakkiri
    scope: template
    outcome: >-
      The lint_prose piece runs hakkiri from mise and a pre-commit hook, with no Vale
      left.
    blocked_by:
      - HKR-008
    acceptance:
      - The templates Template check passes, and one pilot project passes CI on its update.

  - id: HKR-010
    title: Release 1
    scope: release
    outcome: Projects that used Vale with ProseStyle run hakkiri instead.
    blocked_by:
      - HKR-009
    acceptance:
      - Every adopted project passes CI on hakkiri.
