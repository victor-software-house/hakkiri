# yaml-language-server: $schema=https://raw.githubusercontent.com/victor-software-house/qctl/main/schema/tasks.schema.json
schema_version: 5
prefix: HKR
active: HKR-013
queue:
  - id: HKR-013
    title: Run the pattern and readability checks
    scope: engine
    outcome: >-
      Rules run consistency, conditional, repetition and readability with Vale
      3.26.0's meaning, or a better one where Vale's is a defect.
    blocked_by: []
    acceptance:
      - Each of consistency, conditional, repetition and readability has unit tests.
      - A 50,000-character line and a 60,000-line file finish with no panic for these four checks.
    plan: openspec/changes/pattern-and-readability-checks/proposal.md

  - id: HKR-014
    title: Run the capitalization, sequence and spelling checks
    scope: engine
    outcome: >-
      Rules run capitalization, sequence and spelling, and existence and substitution
      accept affix, with Vale 3.26.0's meaning, or a better one where Vale's is a
      defect.
    blocked_by:
      - HKR-013
    acceptance:
      - Each of capitalization, sequence, spelling and affix has unit tests.
      - A 50,000-character line and a 60,000-line file finish with no panic for these three checks.
    plan: openspec/changes/case-sequence-and-spelling-checks/proposal.md

  - id: HKR-005
    title: Ship the check and test commands
    scope: cli
    outcome: >-
      hakkiri check lints files in parallel and hakkiri test runs rule cases,
      released as binaries through verctl.
    blocked_by: []
    acceptance:
      - Integration tests cover line and JSON output, exit status by level, and .ctl/hakkiri.yaml globs and levels.
      - JSON output holds no ESC byte with CLICOLOR_FORCE=1.
      - A verctl Version PR publishes a release that mise installs.

  - id: HKR-006
    title: Fetch and cache rule packages
    scope: packages
    outcome: >-
      A project pins rule packages by version and hash, and check fetches them with
      no sync step.
    blocked_by:
      - HKR-005
    acceptance:
      - Tests cover the first fetch, a cache hit and a hash mismatch.

  - id: HKR-007
    title: Import Vale styles
    scope: import
    outcome: >-
      hakkiri import vale converts every Vale rule type except script into the format.
    blocked_by:
      - HKR-005
      - HKR-013
      - HKR-014
    acceptance:
      - Each converted Voices, Std and Readability rule passes the cases from its own Vale file.

  - id: HKR-008
    title: Run ProseStyle on hakkiri
    scope: prose-style
    outcome: >-
      prose-style publishes a hakkiri package with its own rules, the converted
      upstream styles and the rate rules.
    blocked_by:
      - HKR-006
      - HKR-007
    acceptance:
      - Every rule case and package case passes under hakkiri test.
      - An alert diff against Vale with ProseStyle 0.0.7 over our public repositories shows only the intended differences.

  - id: HKR-009
    title: Switch the template to hakkiri
    scope: template
    outcome: >-
      The lint_prose piece runs hakkiri from mise and a pre-commit hook, with no Vale
      left.
    blocked_by:
      - HKR-008
    acceptance:
      - The templates Template check passes, and one pilot project passes CI on its update.

  - id: HKR-010
    title: Release 1
    scope: release
    outcome: Projects that used Vale with ProseStyle run hakkiri instead.
    blocked_by:
      - HKR-009
    acceptance:
      - Every adopted project passes CI on hakkiri.
archive:
  - id: HKR-004
    title: Build the rule engine
    scope: engine
    outcome: >-
      Rules select text by scope, then run existence, substitution, occurrence and metric, with rates through metric.
    notes:
      - 2026-11-09, a word count reads a code span as one word, where Vale 3.26.0 reads none; link text counts and its target does not, as in Vale. HKR-002 lists the intended differences.
    plan: openspec/changes/archive/2026-11-10-rule-engine/proposal.md
    completed: 2026-11-10T15:24:36
    evidence:
      - PRs 17, 18, 20, 21, 22 and 23 merged the rule engine at e7c546a, with Flesch-Kincaid within 0.01 of Vale on 51 inputs; the rule-engine OpenSpec change is archived.
    disposition: completed

  - id: HKR-015
    title: Split sentences
    scope: engine
    outcome: >-
      Sentences come from hakkiri's own Punkt splitter and model, at least as
      accurate as Vale's on every evaluation set.
    plan: openspec/changes/archive/2026-11-10-sentence-splitter/proposal.md
    completed: 2026-11-10T13:01:41
    evidence:
      - PR 14 merged the splitter and its model at e3b7d77; PR 15 adds the evaluation test, and the sentence-splitter OpenSpec change is archived.
    disposition: completed

  - id: HKR-012
    title: Give tree nodes their text segments
    scope: tree
    outcome: Every tree node reads its text from file ranges that hold no markup.
    plan: openspec/changes/archive/2026-11-10-node-segments/proposal.md
    completed: 2026-11-10T08:28:34
    evidence:
      - PR 7 merged the document tree and its segments at 94ae55e; both OpenSpec changes are archived.
    disposition: completed

  - id: HKR-003
    title: Build the document tree and language profiles
    scope: tree
    outcome: >-
      Markdown, MDX, and Rust, TypeScript and JavaScript comments parse into one node
      tree with byte spans.
    plan: openspec/changes/archive/2026-11-10-document-tree/proposal.md
    completed: 2026-11-10T08:28:34
    evidence:
      - PR 7 merged the document tree and its segments at 94ae55e; both OpenSpec changes are archived.
    disposition: completed

  - id: HKR-002
    title: Design the rule and config format
    scope: format
    outcome: >-
      One approved spec defines the rule files and .ctl/hakkiri.yaml before any
      engine code.
    plan: openspec/changes/archive/2026-11-10-rule-format/proposal.md
    completed: 2026-11-10T06:51:07
    evidence:
      - The rule-format change merged in PR 3 and PR 4 at 4646cb0 and is archived.
    disposition: completed

  - id: HKR-001
    title: Scaffold the repository
    scope: repo
    outcome: >-
      The repository holds the template render, the work queue, OpenSpec, and the
      research and decisions behind the plan.
    plan: openspec/changes/archive/2026-11-09-bootstrap-hakkiri/proposal.md
    completed: 2026-11-09T17:42:10
    evidence:
      - Repository, template render, queue and the bootstrap-hakkiri OpenSpec change merged in PR 1.
    disposition: completed
horizon:
  - id: HKR-011
    title: Serve alerts and fixes in editors
    scope: lsp
    outcome: hakkiri lsp shows alerts and offers swap fixes in editors.
    kind: deferred
    open: Release 1 has not shipped.

  - id: HKR-016
    title: Parse long Markdown files in linear time
    scope: tree
    outcome: >-
      A Markdown file of 60,000 lines parses in time that grows linearly with its
      size.
    kind: research
    open: "Measured: markdown-rs 1.0.0 alone takes 2.5 s at 60,000 lines in a release build, and 0.17 s at 15,000, so its time grows with the square of the line count, for one paragraph and for 60,000 separate paragraphs. Missing: whether upstream knows of it, and a fix, in markdown-rs or by splitting the source before it parses."

  - id: HKR-017
    title: Read comments in more languages
    scope: tree
    outcome: Comment prose in the common programming languages is linted, built in.
    kind: deferred
    open: The language list and its parsers are not chosen yet.

  - id: HKR-018
    title: Lint identifiers for machine-made naming
    scope: rules
    outcome: >-
      Rules flag identifiers and code terms in the style recent language models
      favour, such as kind, seam and gate.
    kind: research
    open: >-
      No published study measures identifier vocabulary before and after 2022; a
      counterfactual excess-frequency run on dated GitHub identifier tokens is the missing
      evidence.
    notes:
      - 2026-11-10, Kobak et al. (Science Advances 2025) measure excess style words in PubMed abstracts against a pre-2023 counterfactual; their 900-word list is MIT at https://github.com/berenslab/llm-excess-vocab.
      - '2026-11-10, Abraham (2026, unreviewed) clusters 461,121 GitHub PR descriptions; per secondary coverage, not checked in the repo, the growing cluster favours load-bearing, quietly, seam and genuinely: https://github.com/louisabraham/load-bearing.'
      - '2026-11-10, Ronacher (2026) ranks agent-session words by inflation against wordfreq: https://lucumr.pocoo.org/2026/5/4/content-for-contents-sake/.'
      - '2026-11-10, prior rule sets: https://github.com/tbhb/vale-ai-tells and https://github.com/Syntaf/vale-llm-slop (comments in source files).'
      - 2026-11-10, Wikipedia Signs of AI writing warns that word tells change across model generations, so a list needs dated evidence and review.
