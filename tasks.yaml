    disposition: completed

  - id: HKR-014
    title: Run the capitalization and sequence checks
    scope: engine
    outcome: >-
      Rules run capitalization and sequence, with Vale 3.26.0's meaning, or a better one where Vale's is a defect.
    plan: openspec/changes/archive/2026-11-10-case-and-sequence-checks/proposal.md
    completed: 2026-11-10T20:59:39
    evidence:
      - PRs 33 and 35 merged the tagger and the dictionary at e32201f, and PRs 36, 37 and 39 merged the capitalization and sequence checks, their scope rules and the long-input tests at d541214; the case-and-sequence-checks OpenSpec change is archived.
    disposition: completed

  - id: HKR-013
    title: Run the pattern and readability checks
    scope: engine
    outcome: >-
      Rules run consistency, conditional, repetition and readability with Vale
      3.26.0's meaning, or a better one where Vale's is a defect.
    plan: openspec/changes/archive/2026-11-10-pattern-and-readability-checks/proposal.md
    completed: 2026-11-10T16:20:54
    evidence:
