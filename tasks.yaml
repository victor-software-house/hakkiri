# yaml-language-server: $schema=https://raw.githubusercontent.com/victor-software-house/qctl/main/schema/tasks.schema.json
schema_version: 5
prefix: HKR
active: HKR-008
queue:
  - id: HKR-008
    title: Run ProseStyle on hakkiri
    scope: prose-style
    outcome: >-
      prose-style publishes a hakkiri package with its own rules, the native ports of the upstream rules worth keeping, and the rate rules.
    blocked_by: []
    acceptance:
      - Every rule case and package case passes under hakkiri test.
      - An alert diff against Vale with ProseStyle v0.0.14 over our public repositories shows only the intended differences.
      - The 14 opt-in rules do not run until a project turns them on, in a test.
      - The release is a patch tag, v0.0.16, only when the alert diff shows hakkiri gives the same or better alerts than Vale with v0.0.14; otherwise it waits.
    notes:
      - '2026-11-11, operator decision: ProseStyle owns its rules. The 36 upstream rule files that ProseStyle.zip copies today (Voices, Direct, Readability, and the Abbreviations, DateTime, Grammar, Punctuation and Usage rules of Std) are reviewed one by one. Each valuable one becomes a native hakkiri rule in the one style ProseStyle, with tests, and the MIT sources are credited in a NOTICE. The rest are dropped with a reason. upstream.toml and the copying go.'
      - '2026-11-11, operator decision: from its next release ProseStyle.zip is the hakkiri package. Vale projects stay pinned to v0.0.14, and the templates pin stays there until HKR-009. There is no second asset.'
      - '2026-11-11, the six script rules of ProseStyle v0.0.14 (FlatRhythm, BareWorkItem, SameSentenceStart, HardBreak, SentencePerLine and PrepositionChain) port to native rules: five existence rules and one metric rule pass the 18 cases of the tag under hakkiri test in a probe. Readability.Polysyllables ports to one existence rule that gave the same 170,781 alerts as Vale 66bbb85 running the script over 238,342 words.'
      - "2026-11-11, operator decision, ports: ProseStyle takes 17 upstream rules that always run. They are Banned, BinaryContrast, InflatedWords, Puffery, Recap, SuperficialAnalysis, ThroatClearing, WeakVerbs and Weasel of Voices, Hedging, Length and Preamble of Direct, FleschKincaid of Readability, and Latin, Spacing, GenderedPronouns and GenderedTerms of Std. Fourteen more ship off through the package settings, for a project to turn on: AutomatedReadability, ColemanLiau, FleschReadingEase, GunningFog, LIX, SMOG, Polysyllables (an existence rule that gave the same alerts as Vale's script over 238,342 words), PassiveVoice, OxfordComma, Contractions, FirstPersonPlural, FirstPersonSingular, DateFormat and TimeFormat. ProseStyle then holds 44 + 31 = 75 rules."
      - "2026-11-11, operator decision, drops: ColonReveal, Ease, Acronyms (UndefinedAcronym covers it) and Ellipses (it flags the … that Emoji allows). Std's SentenceLength folds into Length."
      - '2026-11-11, operator decision, renames: Banned becomes SlopWords, Recap RecapOpener, Weasel VagueAttribution, Latin LatinAbbreviation, Spacing SentenceSpacing, Length SentenceLength and FleschKincaid GradeLevel. Hedging and Preamble keep their names, and every other port keeps its upstream name.'
      - "2026-11-11, operator decision, overlaps: no text draws two alerts for one fault. Drop 'harness the power' from StockPhrases, since SlopWords covers it, and make 'stands as a testament' draw only the Puffery alert. SentenceLength at 25 words as a suggestion beside LongSentence at 40 as an error stays by design."
      - '2026-11-11, operator decision: the opt-in rules ship off through a package settings file, so this row waits for HKR-040.'
      - '2026-11-11, operator decision: the tag stays a patch while the package works the same or better, and every rule is validated. prose-style v0.0.15 goes to PullRequestStyle, a Vale package (prose-style PR 32), so this package takes v0.0.16.'
      - '2026-11-11, the package settings carry the OpenSpec proposal entry under block_ignores, so the release waits for HKR-043 in a hakkiri release; the alert diff covers the nine repositories that run Vale today: nishiki, hakkiri, verctl, ctl-core and five private ones.'
      - '2026-11-12, found while judging the NounStack alerts of nine repositories for HKR-052: the rule says each noun is a lowercase word, but its pattern [a-z][a-z-]* has no anchor, so a capitalised name such as GitHub counts as a noun of a stack. The package branch owner is asked to anchor it; row HKR-057 tracks it.'
      - '2026-11-12, correction to the note on NounStack: an anchor matches nothing in hakkiri 0.0.5 or Vale 3.26.0, so the package pattern is a lookaround, (?<![A-Za-z])[a-z][a-z-]*(?![A-Za-z]), that counts a word only when it is lowercase from its first to its last letter. Row HKR-057 tracks it.'

  - id: HKR-043
    title: Skip blocks and tokens by pattern
    scope: config
    outcome: >-
      A glob can skip the blocks and the inline text that a pattern matches, as Vale
      BlockIgnores and TokenIgnores do.
    blocked_by: []
    acceptance:
      - A files glob takes block_ignores and token_ignores, each a list of patterns, and the text they match draws no alert, with the alerts Vale 66bbb85 gives on probes for the same BlockIgnores and TokenIgnores.
      - A package settings file can hold both keys, and a project glob adds to them.
    notes:
      - "2026-11-11, operator decision: hakkiri matches Vale here, under Vale's own names in the config's casing. OpenSpec 1.16.0 and 1.17.0 refuse a proposal without the headings Why and What Changes, and ProseStyle.ChattyHeadings flags both at the error level; six repositories skip the two lines with BlockIgnores today, and one uses TokenIgnores."
      - 2026-11-11, the ProseStyle package carries the proposal entry, so the template and the consumers write none (lead decision).
    plan: openspec/changes/block-token-ignores/proposal.md

  - id: HKR-044
    title: Choose which files a run reads
    scope: files
    outcome: >-
      A run skips what git ignores and says what it does with a named file no glob
      selects, and every check option can be set in the config, a flag or a variable.
    blocked_by: []
    acceptance:
      - A walk skips the files and folders that .gitignore, .git/info/exclude and the global git excludes ignore, unless gitignore is false (--no-gitignore, HAKKIRI_GITIGNORE).
      - A file named on the command line that no glob selects draws a warning by default, and on_unmatched (--on-unmatched, HAKKIRI_ON_UNMATCHED) takes warn, error or ignore; error makes the run exit 2, and ignore reports nothing.
      - fail_level, gitignore and on_unmatched are config keys as well as flags and variables, the flag winning, then the variable, then the config, then the default.
    notes:
      - '2026-11-11, operator decision: git-ignored files are skipped by default, everything stays configurable in the config file and overridable by flags and variables as ctl-core allows, and the names are gitignore and on_unmatched. The ignore crate is the authorized new dependency for the walk.'
      - 2026-11-11, the templates lint:prose task passes every tracked file because Vale walks git-ignored folders while a build writes them; with this row it runs a bare hakkiri check.
    plan: openspec/changes/gitignore-walk/proposal.md

  - id: HKR-045
    title: Fill indexed verbs in messages
    scope: engine
    outcome: >-
      A rule message fills Go's indexed verbs such as %[1]s and %[2]s, as Vale's
      messages do.
    blocked_by: []
    acceptance:
      - The cases of ProseStyle v0.0.14 NounStack and ThingsSpeakNoun pass, with the message Vale 66bbb85 prints for the same match.
    notes:
      - '2026-11-11, found by the ProseStyle port: hakkiri prints %[1]s %[2]s unfilled in a sequence rule message, and hakkiri main has no support for indexed verbs.'
    plan: openspec/changes/indexed-verbs/proposal.md

  - id: HKR-046
    title: Keep a fence open across a blank doc-comment line
    scope: tree
    outcome: >-
      A fenced block in a Rust doc comment stays code across a blank comment line, as
      Markdown reads it.
    blocked_by: []
    acceptance:
      - "The ProseStyle v0.0.14 BareURLInComment case 'keeps a doc comment's fence open across a blank line' passes: hakkiri reports no URL inside the fence."
    notes:
      - '2026-11-11, found by the ProseStyle port: hakkiri reports a URL inside the fence that Vale skips; the cause is not yet traced.'
      - '2026-11-11, traced: comments::groups joined line comments only when exactly one line break lay between them, so a blank line between two doc lines cut the comment in two and the fence opened before it was gone. Vale joins the same way, but its raw scope reads the whole file. Doc line comments now join across blank lines, as rustdoc reads them.'
    plan: openspec/changes/doc-fence/proposal.md

  - id: HKR-047
    title: End an alert where a multi-line match ends
    scope: engine
    outcome: >-
      An alert for a match that spans lines names the line and column of the match's last character.
    blocked_by: []
    acceptance:
      - The JSON alert carries end_line and end_column of the last character of the match, also for a match on one line, and a test covers a match across a line wrap and one across markup.
      - The alerts spec, the check-command spec's alert field list and the instructions state it, vale-differences records that Vale prints the first column plus the match length, which can pass the end of the line, and the vocabulary-rules comparison checks the end through that mapping.
    notes:
      - "2026-11-11, operator decision: the true end, with a new end_line field in the JSON. hakkiri never copies a flaw of Vale's to match it; Vale's count can point past the end of the line, and hakkiri's alerts spec stopped at the end of the first line."
      - 2026-11-11, the pretty line keeps path:line:column, so tools that parse it are unaffected.
    plan: openspec/changes/match-end/proposal.md

  - id: HKR-030
    title: Read files by extension, with plain text by default
    scope: engine
    outcome: A file whose extension has no reader is read as plain text, formats maps an extension to a reader as Vale [formats] does, and on_unknown can turn the plain-text default off.
    blocked_by: []
    acceptance:
      - A file with an extension that has no reader, such as notes.txt or Cargo.toml, that a glob selects or a name lists is linted as plain text, and the vale-differences scenario for it is removed.
      - 'formats maps an extension to a reader, such as toml: text or mdx: md, as Vale [formats] does, and a package settings file can hold it.'
      - on_unknown (--on-unknown, HAKKIRI_ON_UNKNOWN) takes text, the default, or warn, error or ignore for an extension with no reader; a binary file is skipped with no alert, as ripgrep and typos skip binaries.
    notes:
      - '2026-11-11, operator decision: a text file a glob or a name lists is read; plain text is the default, extensions can be remapped as in Vale, and the default can be turned off.'
    plan: openspec/changes/plain-text-files/proposal.md

