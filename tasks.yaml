  - id: HKR-035
    title: Import a Vale config
    scope: config
    outcome: hakkiri import vale [SOURCE] converts a .vale.ini into the project config.
    blocked_by: []
    acceptance:
      - With no argument in a folder under a .vale.ini, the command writes .ctl/hakkiri.yaml, and a second run refuses to overwrite it unless --force is given.
      - The --dry-run flag prints the conversion and writes nothing.
      - A section converts to a glob, BasedOnStyles to styles, a level to its level, YES and NO to on and off, and MinAlertLevel to level, each with a test.
      - Each Vale setting the conversion cannot carry is listed in the vale-differences Known gaps with a row.
    notes:
      - "2026-11-11, command shape decided (operator): hakkiri import vale [SOURCE]. With no argument it uses Vale's upward lookup for .vale.ini or _vale.ini. It writes the file --config names, default .ctl/hakkiri.yaml, and refuses an existing file unless --force (-F, as qctl init). The --dry-run flag is ctl-core's preview flag. --force is the only new flag; --config, --format and --color already exist on the other verbs."
      - A .vale.ini package URL needs a sha256 the file does not hold; HKR-006 decides whether the import fetches it.

