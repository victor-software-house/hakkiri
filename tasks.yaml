  - id: HKR-036
    title: Run Tengo script rules
    scope: engine
    outcome: >-
      A script rule runs as Vale runs its Tengo program, and a style that holds one
      needs no off in the config.
    blocked_by:
      - HKR-008
    acceptance:
      - Readability.Polysyllables flags the same words as Vale 3.26.0 in a parity test.
      - A script that never ends stops after a step budget, with an error that names the rule.
      - The vale-differences scenario for a script rule is removed.
    notes:
      - '2026-11-11, size: no maintained Rust Tengo exists (crates.io has none; one repository, Laine-S/tengo-rs, holds a single commit and no release). An interpreter of the subset Vale scripts use is about 2,000 to 2,500 lines: := and =, if, for and for-in, func and closures, arrays, maps, slices, the ternary, import, len, append, float, about 25 text functions, and math. Vale gives a script the modules text, fmt and math, the variable scope, the result matches with begin, end and message, a 2 s limit, and a .tengo file under config/scripts.'
      - HKR-008 ports the six script rules of ProseStyle v0.0.14 to native rules, so this row is not on its path.
      - "2026-11-11, operator decision: hakkiri's interpreter must run scripts measurably faster than Vale does, and the row stays queued."

