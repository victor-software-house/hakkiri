[package]
name = "hakkiri"
version = "0.0.6"
edition = "2024"
rust-version = "1.100.0"
description = "A prose linter for Markdown, MDX and source comments"
license = "AGPL-3.0-or-later"
repository = "https://github.com/victor-software-house/hakkiri"
keywords = ["prose", "lint", "markdown", "documentation", "cli"]
categories = ["command-line-utilities", "text-processing"]
# Releases ship prebuilt binaries from GitHub Releases only.
publish = false

[lints.rust]
# deny instead of forbid, because forbid refuses the item-level
# #[expect(unsafe_code, reason = "...")] that a justified exception carries.
unsafe_code = "deny"
# Each unsafe operation inside an unsafe fn sits in its own unsafe block.
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"
# New in Rust 1.100 and warn by default: an unescaped `|` in a table row drops
# cells.
invalid_markdown_table = "deny"

[lints.cargo]
# Cargo's own lints, new in Rust 1.100. Clippy's -D warnings does not reach
# them, so each group is denied here; correctness is deny already.
# unused_dependencies (style) checks [dependencies] and [build-dependencies]
# from what the compiler used. cargo-machete in `deps` still covers
# [dev-dependencies].
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A function that returns Result reports failure through it instead of a panic.
panic_in_result_fn = "deny"
# map_err(|_| ...) drops the cause; wrap it as a source instead. A site whose
# error carries nothing carries #[expect(clippy::map_err_ignore, reason = "...")].
map_err_ignore = "deny"
# `format!` or `push_str` instead of `+` on a String.
string_add = "deny"
# From and TryFrom instead of as, which can silently truncate or wrap. A site
# that truly needs as carries #[expect(clippy::as_conversions, reason = "...")].
as_conversions = "deny"
# Rc<str> and Rc<[T]> instead of Rc<String> or Rc<Vec<T>>.
rc_buffer = "deny"
# Rc::clone(&x), so a cheap pointer clone reads apart from a deep copy.
clone_on_ref_ptr = "deny"
# Every unsafe block carries a // SAFETY: comment and holds one unsafe
# operation, so each comment justifies exactly one call.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# foo.rs beside foo/, never foo/mod.rs. The Rust Book calls foo.rs the
# idiomatic path and mod.rs the older style (ch07-05, "Alternate File Paths").
# Many files named mod.rs blur together in an editor.
mod_module_files = "deny"
# An item from another module comes in through `use`, and the code names it
# by its last segment, or a function by its module: `fs::read`, never
# `std::fs::read` inline. The default limit is two segments.
absolute_paths = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny fails on them (`bans.multiple-versions`).
multiple_crate_versions = "allow"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = [
  # clap does not build without it.
  "std",
  # The `#[derive(Parser)]` grammar in `src/cli.rs`.
  "derive",
  # `env_prefix` binds each long option to a `HAKKIRI_*` variable.
  "env",
  # A parse error names the argument and its valid values.
  "error-context",
  # A parse error suggests the nearest flag or verb.
  "suggestions",
] }
ctl-core = { version = "0.7.5", default-features = false, features = [
  "app",
  "input",
] }
fancy-regex = "0.20.1"
# The front matter of a Markdown file: its block and its top-level values, one
# parser per format.
front-matter = "0.0.2"
globset = { version = "0.4.21", default-features = false }
# A walk that skips what .gitignore, .git/info/exclude and the global git
# excludes ignore, as ripgrep does.
ignore = "0.4.34"
garde = { version = "0.23.0", default-features = false, features = ["derive"] }
# The table of languages: names, aliases, extensions, file names and
# interpreters, generated from GitHub Linguist.
langdex = "0.0.1"
markdown = "1.0.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
# The checksum of a downloaded package.
sha2 = "0.11.1"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
# A package pinned by url is downloaded with rustls and the bundled root
# certificates, which a static musl binary needs, and read as a zip without the
# compressors.
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
zip = { version = "9.5.1", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }

# musl's allocator takes a lock that threads fight over, and a parallel `check`
# runs about eight times slower with it, so the musl build links mimalloc.
# No other build does.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
ctl-core = { version = "0.7.5", default-features = false, features = [
  "fixture",
] }
insta = { version = "1.49.0", features = ["glob"] }
serde_json = "1.0.154"

# The smallest binary that keeps its speed. Against opt-level 3 with thin LTO,
# a ctl CLI came out 35% smaller and 4% slower.
#
# opt-level "z" takes another 25% off but runs a ledger parse 51% slower. A
# repository whose run time does not matter sets it here. Cargo ignores the
# profiles of a dependency, so a library's consumers see none of this.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
